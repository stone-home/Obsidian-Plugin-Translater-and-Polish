# Writing

## 1. Scope

Applies to every piece of text an agent writes into a file, in any project and any format: Markdown, documentation, notes, rules, Skills, plain text, and prose inside string values of YAML, JSON, or similar data files. Comments and docstrings in source code follow the language's formatter and line-length standard instead. This rule governs how the text is laid out in the file; the other rules govern what it says.

## 2. Hard Invariants (NEVER violate)

- Never insert a line break inside a paragraph, list item, table cell, heading, or string value to wrap text or align it at a column. Write each as one line and let the viewer wrap it.

## 3. Standards

### Line breaks

- Break lines only where the format's structure needs it: between paragraphs, list items, headings, and table rows, and inside code blocks, which keep their own layout.
- When editing a file that already wraps its prose at a column, write the paragraphs you add or change as single lines and leave untouched paragraphs as they are unless the user asks for the whole file.

# Skills-hub rules

Read a listed rule file before the work its description covers.

- `.skills-hub/plugins/highest-court/rules/highest-court-exploration-discussion.mdc`: Use for philosophy, open-ended discussion, brainstorming and thought experiments. Factual claims within the discussion still use Factual Evidence; speculation alone does not trigger research-code requirements.
- `.skills-hub/plugins/highest-court/rules/highest-court-facts-verification.mdc`: Use for factual answers, claim verification, data or paper analysis, quotations and current information. Apply only to factual portions of speculative or creative tasks.
- `.skills-hub/plugins/highest-court/rules/highest-court-mcp-invocation.mdc`: Read this rule only when calling an MCP tool to list, search, read, write, or delete. Leave it unread for answers, file edits, and shell commands that do not call MCP.
- `.skills-hub/plugins/highest-court/rules/highest-court-project-management.mdc`: Use when working on an identified project or repository — reading project context, maintaining the project brief, or choosing, creating, or moving paths for code, documentation, notes, experiments, artifacts, tests, or playground files. Do not trigger brief creation for generic questions, casual chat, or unrelated brainstorming, and do not use this rule to choose plot colors, fonts, or export mechanics.
- `.skills-hub/plugins/highest-court/rules/highest-court-research-methods.mdc`: Use when designing, assessing or implementing research methods, hypotheses or experiments. Ordinary software changes and bug fixes do not require a new scientific foundation.
- `.skills-hub/plugins/program/rules/program-agent-conduct.mdc`: Generic tool conduct for agents, covering untrusted content, tool-backed reporting and tool failures, secrets, least privilege and authorization, one writer per file, and repository-local Skill composition. Use when a task runs tools, reads or writes files, executes commands, or runs a Skill workflow. Do NOT use for conversation-only answers that use no tool.
- `.skills-hub/plugins/program/rules/program-code-development.mdc`: Production-code protocol covering developer/tester separation, TDD red-green-refactor cycles, dependency and SDK selection, instruction conflict order, function boundaries, and root cause before fixes. Use when writing, changing, or testing production code, or when handing a diagnosed bug to a fix. Do NOT use for documentation-only edits or context-only code explanations.
- `.skills-hub/plugins/nodejs/rules/nodejs-javascript.mdc`: JavaScript standards for project-native runtime targets, module system, async handling, runtime validation, and package-manager tooling. Use when writing, changing, or reviewing JavaScript source or tests (.js, .mjs, .cjs) in Node or browser packages. Do NOT use for TypeScript files (use nodejs-typescript) or for non-JavaScript files in a mixed task. Files: **/*.js, **/*.mjs, **/*.cjs.
- `.skills-hub/plugins/nodejs/rules/nodejs-typescript.mdc`: TypeScript standards for compiler strictness, boundary narrowing, project-native runtime, serverless waterfall elimination, and package-manager tooling. Use when writing, changing, or reviewing TypeScript source, types, or tests (.ts, .tsx). Do NOT use for plain JavaScript files or for non-TypeScript files in a mixed task. Files: **/*.ts, **/*.tsx.
- `.skills-hub/plugins/obsidian/rules/obsidian-plugin.mdc`: Obsidian plugin conventions for the plugin API, manifest, bundle, versioning, and release assets. Use when writing, changing, or reviewing an Obsidian plugin's source, manifest.json, versions.json, styles.css, bundler configuration, or release. Do NOT use for Obsidian vault notes or for general JavaScript and TypeScript standards, which the nodejs profile's rules own. Files: **/*.ts, **/*.tsx, **/*.js, **/*.mjs, manifest.json, versions.json, styles.css.
- `.skills-hub/plugins/pm/rules/pm-plan-conventions.mdc`: Plan, Requirement, and Architecture Decision Record (ADR) filenames, frontmatter, status, and required sections in the PKM workspace. Use when creating or editing a project plan, feature requirement, or ADR in the configured ProjectPaths.pkm workspace. Do NOT use for Atomic or Protocol notes (use docs-note-conventions if the docs cat is enabled) or for Objective and Run notes (use pkm-note-contracts if the pkm cat is enabled). Files: pkm/**/*.md.
- `.skills-hub/plugins/pm/rules/pm-repo-layout.mdc`: Target repository layout and artifact-routing blueprint across code, HomeLab, plugin, Skill, and research projects. Use when deciding where documentation, notes, plans, code, infrastructure manifests, experiments, paper assets, or scratch scripts belong, or when guiding repository composition. Do NOT use for standalone Obsidian knowledge vaults (use pkm-maintain-vault if the pkm cat is enabled) or to force an existing project to reorganize without authorization. Files: README.md, AGENTS.md, docs/**/*.md.
